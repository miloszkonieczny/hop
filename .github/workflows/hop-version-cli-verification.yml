# Isolated read-only test of the release-safe version CLI. No installation.
name: Hop — Release Version CLI Preflight
on:
  push:
    branches: [hop-fix/2026-10-25-safe-version-cli]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  version-cli:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build optimized release-mode executable
        shell: bash
        run: |
          set -euo pipefail
          swift build -c release --arch arm64
      - name: Assert release CLI exits rapidly and prints one version
        shell: bash
        run: |
          set -euo pipefail
          bin="$(swift build -c release --arch arm64 --show-bin-path)/Hop"
          test -f "$bin"
          HOP_EXECUTABLE="$bin" python3 - <<'PY'
          import os, re, subprocess
          binary = os.environ["HOP_EXECUTABLE"]
          result = subprocess.run([binary, "--preparing-version"],
                                  timeout=10, capture_output=True, text=True, check=False)
          print("exit_code:", result.returncode)
          print("stdout:", result.stdout.strip())
          assert result.returncode == 0, "version flag failed or entered the GUI"
          assert not result.stderr.strip(), "unexpected stderr"
          assert re.fullmatch(r"\d+(?:\.\d+){1,3}(?:[-+][A-Za-z0-9._-]+)?",
                              result.stdout.strip()), "unexpected version output"
          PY
      - name: Run complete standard repository validation
        shell: bash
        run: ./scripts/checks.sh
