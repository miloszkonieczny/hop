name: Hop PERF-01 — Frozen Baseline Measurement

on:
  push:
    branches:
      - hop-perf/2026-10-23-observability
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hop-perf-01-${{ github.ref }}
  cancel-in-progress: false

jobs:

  sampler-test:
    name: Preflight measurement tools
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Sampler regression and adversarial tests
        run: |
          set -euo pipefail
          python3 scripts/perf/test_process_sampler.py
          python3 scripts/perf/test_run_bounded.py
      - name: Known busy vs idle CPU calibration (before any Swift build)
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 scripts/perf/preflight.py --output evidence/preflight.json
      - name: Preserve preflight evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hop-perf-preflight-${{ github.sha }}-${{ github.run_id }}
          path: evidence/
          retention-days: 30
          if-no-files-found: warn

  benchmark:
    name: Sequential same-host DEBUG baseline (no GUI acceptance)
    needs: sampler-test
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - name: Checkout exact measurement harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false

      - name: Checkout frozen v1.5
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 593eeec1d2d9cc6ac0ee2775b403146a58b8980d
          path: v15
          persist-credentials: false

      - name: Checkout frozen v1.6
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 7ec28b7d1e5764d86d66afa53d3244d667c6ba9e
          path: v16
          persist-credentials: false

      - name: Freeze identities and machine environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "$(uname -m)" = arm64
          test "$(git -C harness rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C v15 rev-parse HEAD)" = "593eeec1d2d9cc6ac0ee2775b403146a58b8980d"
          test "$(git -C v16 rev-parse HEAD)" = "7ec28b7d1e5764d86d66afa53d3244d667c6ba9e"
          {
            echo "harness_sha=$GITHUB_SHA"
            echo "candidate_v15=$(git -C v15 rev-parse HEAD)"
            echo "candidate_v16=$(git -C v16 rev-parse HEAD)"
            echo "runner_arch=$(uname -m)"
            echo "runner_image=$ImageOS $ImageVersion"
            echo "cpu_count=$(sysctl -n hw.logicalcpu)"
            sysctl hw.model
            sw_vers
            xcodebuild -version
            swift --version
            sysctl vm.swapusage
            ps -axo pid,ppid,%cpu,rss,comm | sort -k3nr | head -n 15 || true
          } > evidence/environment.txt
          cat evidence/environment.txt

      - name: Build frozen v1.5 as DEBUG Hop Dev (bounded; no installation)
        shell: bash
        run: |
          set -euo pipefail
          python3 harness/scripts/perf/run_bounded.py \
            --cwd v15 --timeout 900 --log evidence/v15-build.log \
            --result evidence/v15-build-result.json -- ./scripts/build-app.sh --dev
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' 'v15/dist/Hop Dev.app/Contents/Info.plist')" = 'com.antonshakirov.minimo.dev'
          test "$(lipo -archs 'v15/dist/Hop Dev.app/Contents/MacOS/Hop')" = 'arm64'
          codesign --verify --strict 'v15/dist/Hop Dev.app'
          shasum -a 256 'v15/dist/Hop Dev.app/Contents/MacOS/Hop' > evidence/v15-executable-sha256.txt

      - name: Build frozen v1.6 as DEBUG Hop Dev (bounded; no installation)
        shell: bash
        run: |
          set -euo pipefail
          python3 harness/scripts/perf/run_bounded.py \
            --cwd v16 --timeout 900 --log evidence/v16-build.log \
            --result evidence/v16-build-result.json -- ./scripts/build-app.sh --dev
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' 'v16/dist/Hop Dev.app/Contents/Info.plist')" = 'com.antonshakirov.minimo.dev'
          test "$(lipo -archs 'v16/dist/Hop Dev.app/Contents/MacOS/Hop')" = 'arm64'
          codesign --verify --strict 'v16/dist/Hop Dev.app'
          shasum -a 256 'v16/dist/Hop Dev.app/Contents/MacOS/Hop' > evidence/v16-executable-sha256.txt

      - name: Verify version handler exits for both development binaries
        shell: bash
        run: |
          set -euo pipefail
          python3 harness/scripts/perf/run_bounded.py \
            --cwd v15 --timeout 10 --log evidence/v15-version.log \
            --result evidence/v15-version-result.json \
            -- './dist/Hop Dev.app/Contents/MacOS/Hop' --preparing-version
          python3 harness/scripts/perf/run_bounded.py \
            --cwd v16 --timeout 10 --log evidence/v16-version.log \
            --result evidence/v16-version-result.json \
            -- './dist/Hop Dev.app/Contents/MacOS/Hop' --preparing-version

      - name: Run repeated same-host A/B/B/A observations (headless)
        shell: bash
        run: |
          set -euo pipefail
          python3 harness/scripts/perf/benchmark_frozen.py \
            --v15 "$PWD/v15/dist/Hop Dev.app/Contents/MacOS/Hop" \
            --v16 "$PWD/v16/dist/Hop Dev.app/Contents/MacOS/Hop" \
            --output evidence/observations --seconds 60 --warmup 8 --cycles 2

      - name: Evidence manifest and fail-closed qualification label
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('evidence')
          files = sorted(p for p in root.rglob('*') if p.is_file())
          comparison_path = root / 'observations/comparison.json'
          comparison = json.loads(comparison_path.read_text()) if comparison_path.exists() else None
          manifest = {
              "schema": "HOP-PERF-01R-1.0",
              "verdict": "HEADLESS_INFRASTRUCTURE_ONLY_NO_GUI_ACCEPTANCE",
              "harness_sha": os.environ["GITHUB_SHA"],
              "runner_run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "baseline_v15": "593eeec1d2d9cc6ac0ee2775b403146a58b8980d",
              "baseline_v16": "7ec28b7d1e5764d86d66afa53d3244d667c6ba9e",
              "build_configuration": "debug",
              "measurement_coverage": comparison.get("measurement_coverage") if comparison else "INCONCLUSIVE_NO_OBSERVATIONS",
              "files": [{"path": str(p), "bytes": p.stat().st_size,
                         "sha256": hashlib.sha256(p.read_bytes()).hexdigest()} for p in files],
          }
          (root / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          print(json.dumps({k:v for k,v in manifest.items() if k!="files"}, indent=2))
          PY

      - name: Upload raw and incomplete evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hop-perf-01r-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          retention-days: 30
          if-no-files-found: warn
