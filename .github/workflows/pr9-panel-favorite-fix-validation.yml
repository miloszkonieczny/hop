name: PR9 Panel Favorite Fix Validation

on:
  push:
    branches:
      - fix/pr9-panel-tab-persistence
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-panel-favorite-fix:
    name: Validate favorite fix and build Hop Dev
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact fix source
        uses: actions/checkout@v4
        with:
          ref: 9d75940c3e29861de9f9fe0a2712fbd2c80817a8
          persist-credentials: false

      - name: Verify source and toolchain
        shell: bash
        run: |
          set -euo pipefail
          expected="9d75940c3e29861de9f9fe0a2712fbd2c80817a8"
          actual="$(git rev-parse HEAD)"
          echo "expected source: $expected"
          echo "actual source:   $actual"
          test "$actual" = "$expected"
          sw_vers
          swift --version

      - name: Repository checks
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/checks.sh

      - name: Build isolated Hop Dev app
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/build-app.sh --dev
          test -d "dist/Hop Dev.app"

      - name: Package and fingerprint
        shell: bash
        run: |
          set -euo pipefail
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "dist/Hop Dev.app/Contents/Info.plist"
          codesign -dv --verbose=2 "dist/Hop Dev.app" 2>&1 || true
          ditto -c -k --sequesterRsrc --keepParent "dist/Hop Dev.app" "Hop-Dev-PR9-panel-favorites-fix-9d75940.zip"
          shasum -a 256 "Hop-Dev-PR9-panel-favorites-fix-9d75940.zip" | tee "Hop-Dev-PR9-panel-favorites-fix-9d75940.sha256"

      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: hop-dev-pr9-panel-favorites-fix-9d75940
          path: |
            Hop-Dev-PR9-panel-favorites-fix-9d75940.zip
            Hop-Dev-PR9-panel-favorites-fix-9d75940.sha256
          retention-days: 7
          if-no-files-found: error
